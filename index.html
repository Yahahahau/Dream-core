<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#cfe6ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="DREAMSCAPE — a first-person exploration of dreamcore and weirdcore places." />
  <title>DREAMSCAPE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2386bff0'/%3E%3Cpath d='M0 44 Q20 34 34 42 T64 40 V64 H0Z' fill='%236fae4c'/%3E%3Crect x='28' y='24' width='10' height='18' fill='%23fff'/%3E%3Cellipse cx='33' cy='14' rx='12' ry='5' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div id="touch-layer"></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="reticle"><span></span></div>
      <div id="prompt" class="hidden"><kbd id="prompt-key">E</kbd><span id="prompt-text"></span></div>
      <div id="location-title"><div class="lt-num"></div><div class="lt-name"></div></div>
      <div id="caption"></div>
      <div id="now-playing"><span class="np-dot"></span><span class="np-text"></span></div>
      <div id="hud-buttons">
        <button id="btn-journal" class="icon-btn" aria-label="Journal" title="Journal (J)">
          <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 17a3 3 0 0 1 3-3h11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button id="btn-pause" class="icon-btn" aria-label="Pause" title="Pause (Esc)">
          <svg viewBox="0 0 24 24"><path d="M8 6v12M16 6v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="joystick"><div id="joystick-knob"></div></div>
      <div id="joy-hint"></div>
      <button id="btn-use" class="hidden" aria-label="Interact"><span id="btn-use-label">Use</span></button>
      <div id="lock-hint" class="hidden">Click to look around · WASD to walk · Shift to run · E to interact</div>
      <div id="fps" class="hidden"></div>
    </div>

    <!-- Menus -->
    <div id="menu-root"></div>

    <div id="loading" class="hidden"><div class="ld-ring"></div><span>dreaming…</span></div>
    <div id="update-toast" class="hidden"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
